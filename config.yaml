# Configuration for the selective audio redaction pipeline.
# Loaded once at startup. No magic numbers in module code — put them here.

audio:
  # Pipeline is PCM-only. Lossy codecs break sample-exact reconstruction.
  sample_rate: 16000
  channels: 1
  sample_width_bytes: 2        # 16-bit PCM
  # Reject rather than silently transcode anything that isn't already WAV/PCM.
  reject_non_wav: true

asr:
  model: "openai/whisper-small"   # bump to -medium / -large-v3 if accuracy is short
  language: "en"
  device: "auto"                  # "auto" = cuda if available else cpu (~5-10x slower)
  compute_type: "float16"         # auto-switched to "int8" when running on CPU

alignment:
  # WhisperX wav2vec2 CTC aligner. Do NOT substitute Whisper's own segment
  # timestamps here — they are too coarse for word-level masking.
  model: "WAV2VEC2_ASR_BASE_960H"
  device: "auto"
  # Set true to use Montreal Forced Aligner instead (more accurate, needs a
  # pronunciation dictionary and separate install). Fallback, not default.
  use_mfa: false

detection:
  # Active entity set. Different compliance regimes need different sets —
  # keep this list editable rather than hardcoding it in detect.py.
  entities:
    # Pattern-based (Presidio regex) — high precision
    - CREDIT_CARD
    - US_SSN
    - PHONE_NUMBER
    - EMAIL_ADDRESS
    - IBAN_CODE
    - DATE_TIME
    # NER-based (spaCy) — context-dependent, lower precision
    - PERSON
    - LOCATION
    # Custom recognizers (detect.py) — context-gated, domain-specific
    - ACCOUNT_NUMBER
    - MEDICAL_RECORD_NUMBER
    - POLICY_NUMBER
  spacy_model: "en_core_web_lg"
  # Spans below this confidence are reported but not masked.
  score_threshold: 0.5
  # Whisper transcribes spoken digits as words ("four five three two").
  # Presidio's regexes will miss those unless this normalization runs first.
  # This is the most common cause of a silent detection failure — leave it on.
  normalize_spoken_numbers: true

masking:
  # Padding around each span. Alignment is imperfect; clipping the first
  # phoneme of a card number leaks information.
  padding_ms: 100
  # What the listener hears in place of the masked span.
  # "silence" | "tone" | "beep"
  replacement: "silence"
  tone_hz: 1000                 # used only when replacement is tone/beep
  cipher: "AES-GCM"
  key_length_bytes: 32          # AES-256
  # The key is NEVER written into the manifest. Path only, read at runtime.
  key_file: "key.bin"

evaluation:
  # WER and BERTScore are computed over non-redacted spans ONLY. Including
  # the masked regions would make the metric meaningless (silence doesn't
  # transcribe, so WER would be dominated by deletions by construction).
  exclude_masked_spans: true
  bertscore_model: "roberta-large"   # pin it — don't let runs drift
  bertscore_lang: "en"
  # Normalization applied identically to reference and hypothesis before WER.
  normalize:
    lowercase: true
    strip_punctuation: true
    expand_contractions: true
    remove_filler_words: false       # keep fillers; they're real content

output:
  dir: "data/outputs"
  # Each stage writes its intermediate artifact under <dir>/<run_id>/ so the
  # demo can show detection output separately from the final audio.
  save_intermediates: true
  manifest_suffix: ".manifest.json"

logging:
  level: "INFO"
  # Per-stage timings. "How long per minute of audio" is a likely defense
  # question — have the numbers ready rather than estimating on the spot.
  log_stage_timings: true

api:
  # DEMO ONLY. Lets the web UI play the unredacted original — which contains
  # exactly the PII this system exists to protect. A real deployment turns this
  # off (or set env ALLOW_ORIGINAL_PLAYBACK=0, which overrides this value).
  allow_original_playback: true
  # Uploads larger than this are rejected before they're processed.
  max_upload_mb: 100
  # Where the API keeps per-upload files (original, masked, manifest, metrics).
  workdir: "data/outputs/api"
  # Vite dev server origin allowed by CORS.
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]

autoencoder:
  # Optional research add-on: four AE variants compared at three pipeline layers
  # (ingest gate, ASR front-end, leak check). Training/GPU eval runs on Colab only.
  # Nothing here is used by the pipeline unless an `integrations.*.enabled` is true.
  seed: 1337
  variants: [dense, sparse, dae, vae]
  drive_root: "/content/drive/MyDrive/redact_ae"   # checkpoints, logs, metrics
  local_cache: "/content/redact_ae_cache"          # fast local copy of the feature cache
  features:
    whisper_model: "small"       # openai-whisper name; features via whisper.log_mel_spectrogram
    n_mels: 80
    window_frames: 16            # model input = 16 frames x 80 mels, flattened
    ola_hop_frames: 4            # overlap-add hop for full-spectrogram application
  data:
    dataset: "openslr/librispeech_asr"
    config: "clean"
    revision: "71cacbfb7e2354c4226d01e70d77d5fca3d04ba1"
    train_split: "train.100"
    dev_split: "validation"      # dev-clean: validation loss, thresholds, lambda/beta selection
    test_split: "test"           # test-clean: final evaluation only, never tuned on
    train_hours: 10.0
    train_speakers: 251          # train-clean-100 speaker count; per-speaker quota = hours / speakers
    max_utt_sec: 30.0            # Whisper's input window
    dev_val_utts: 600
    dev_tune_utts: 400
    test_asr_utts: 200
    test_ingest_utts: 300
    test_leak_utts: 300
  model:
    hidden: [512, 256]
    latent: 64
  train:
    optimizer: "adam"
    lr: 1.0e-3
    weight_decay: 0.0
    batch_size: 512
    epochs: 40
    grad_clip: 1.0
    windows_per_epoch: 225000
    val_hop_frames: 8
    keep_epoch_checkpoints: 2    # latest.pt and best.pt are always kept as well
  # The only per-variant knobs. Each grid is searched on dev-clean, picked per layer.
  variant_hparams:
    sparse: {name: "l1_weight", grid: [1.0e-4, 1.0e-3, 1.0e-2]}
    vae: {name: "beta", grid: [0.1, 0.5, 1.0]}
  corruption:
    snr_db: [0.0, 20.0]
    pink_noise_prob: 0.5
    bandlimit_prob: 0.5
    bandlimit_hz: [300, 3400]
    mulaw_prob: 0.5
    mulaw_channels: 256
  eval:
    batch_windows: 8192
    ingest:
      dc_offset: 0.4
      clip_gain: 20.0
      noise_dbfs: -20.0
      tone_hz: [200, 3000]
      mulaw_heavy_channels: 16
    asr:
      snrs_db: [20, 10, 5, 0]    # each = noise + telephone band-limit + mu-law
      batch_size: 16
      clean_wer_tolerance_pp: 0.5
      dev_select_utts: 50
      dev_select_snr_db: 10
    leak:
      fills: [silence, tone, noise]
      fragment_ms: [25, 50]      # 0 ms = negatives
      span_ms: [400, 1500]
      tone_hz: 1000
      noise_dbfs: -45.0
      vad_rel_db: -30.0
      dev_spans: 200
  bench:
    audio_sec: 60
    warmup: 3
    repeats: 20
  integrations:
    # All off by default: with these false, the CLI behaves exactly as without autoencoders.
    ingest_gate:
      enabled: false
      checkpoint: ""             # path to a best.pt
      threshold: null            # from <variant>/ingest/metrics.json -> chosen.threshold
      action: "warn"             # warn | reject
    asr_frontend:
      enabled: false
      checkpoint: ""             # cleans a COPY of Whisper's mel; output audio is never touched
    leak_check:
      enabled: false
      checkpoint: ""
      metrics: ""                # <variant>/leak/metrics.json (holds per-fill calibration + threshold)
